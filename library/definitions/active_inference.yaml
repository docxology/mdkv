      # 主动推断与自由能原理

      这是生成模型下主动推断的合成教学示例。关于机体、皮层和注意的说法是
      模型解释，不是生物学必然性或实证验证。代码使用负效用加上 0.1 倍预测
      熵的启发式评分；它不是一般期望自由能（EFE）的推导，也不含认识性信息增益。

      ## 关键直觉

      - 机体内含可预测感觉的生成模型。
      - 知觉通过变分推断更新信念以降低预测误差。
      - 行动改变世界，使感觉符合预测。
      - 学习更新模型参数与结构。

      ## 精度与注意

      误差信号的影响取决于其精度（方差的倒数），常被解释为注意增益。

      ## 变分自由能（概要）

      \(\mathcal{F}(q,\theta;o)=\mathbb{E}_q[\log q-\log p_\theta(o,s)]\ge -\log p_\theta(o)\)。

      假设证据为正且有限，KL 散度有定义。离散概率质量满足 \(p_\theta(o)\le1\)，
      故 \(\mathcal{F}\ge0\)；连续概率密度可以超过 1，因此 \(\mathcal{F}\) 可以为负。

      ## 预测编码、作为推断的行动、作为推断的规划

      分层消息传递；策略选择最小化期望自由能。

      ## 示例、应用与阅读

      见主轨代码与 `refs`；并含层级模型和连续控制要点。

  - id: translation-ar
    type: translation
    language: ar
    content: |
      # الاستدلال النشط ومبدأ الطاقة الحرة

      هذا مثال تعليمي اصطناعي للاستدلال النشط تحت نموذج توليدي. وصف الكائنات
      والقشرة والانتباه تفسير للنموذج وليس تحققًا تجريبيًا أو ضرورة بيولوجية.
      تستخدم الشيفرة مقياسًا استدلاليًا: منفعة سالبة مع 0.1 من الإنتروبيا
      التنبؤية؛ وليس اشتقاقًا عامًا لـ EFE ولا يتضمن مكسبًا معلوماتيًا معرفيًا.

      ## أفكار أساسية

      - نموذج توليدي يتنبأ بالمدخلات الحسية.
      - الإدراك يحدّث المعتقدات لتقليل أخطاء التنبؤ.
      - الفعل يغيّر العالم ليتوافق الإحساس مع التنبؤ.
      - التعلّم يحدّث معلمات وبنية النموذج.

      ## الدقّة والانتباه

      وزن الخطأ يعتمد على دقته (معكوس التباين) ويرتبط بالكسب الانتباهي.

      ## الطاقة الحرة التغييرية (موجز)

      \(\mathcal{F}(q,\theta;o)=\mathbb{E}_q[\log q-\log p_\theta(o,s)]\ge -\log p_\theta(o)\).

      نفترض دليلًا موجبًا منتهيًا وتباعد KL معرّفًا. للكتلة الاحتمالية المتقطعة
      \(p_\theta(o)\le1\) نحصل على \(\mathcal{F}\ge0\)؛ أما الكثافة المستمرة
      فقد تتجاوز 1 وتكون \(\mathcal{F}\) سالبة.

      ## الترميز التنبؤي والفعل بوصفه استدلالًا

      تمرير رسائل هرمي؛ اختيار السياسات يقلّل الطاقة الحرة المتوقعة.

      ## مثال وتطبيقات وقراءات

      راجع الشيفرة في المسار الرئيسي و`refs`، إضافةً إلى النماذج الهرمية والتحكم المستمر.

  - id: translation-hi
