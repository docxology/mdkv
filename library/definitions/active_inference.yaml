  - id: primary
    type: primary
    language: en
    content: |
      # Active Inference and the Free Energy Principle

      This synthetic teaching illustration describes Active Inference (AIF) as a
      modelling framework for perception, action, and learning under a generative
      model. Statements about organisms, attention, and cortical processing below
      are modelling interpretations, not established biological necessities or
      empirical validation. No neuroscience or model-effectiveness result is tested.

      ## Key Intuitions

      - In this interpretation, organisms are modelled using predictive generative models.
      - Perception updates beliefs to reduce prediction errors (via variational inference).
      - Action changes the world to make sensations conform to predictions (closed-loop control).
      - Learning updates model parameters and structure to improve predictions over time.

      ## Precision and Attention

      The influence of a prediction error depends on its precision (inverse variance).
      Precision weighting is often identified with attentional gain control: higher
      precision on a channel increases the impact of its errors on belief updates,
      shaping perception and action selection.

      ## Variational Free Energy (Sketch)

      Let observations be \(o\), latent states \(s\), parameters \(\theta\), and a
      generative model \(p_\theta(o, s) = p_\theta(o \mid s) p_\theta(s)\). Using an
      approximate posterior \(q(s)\), the variational free energy is

      \[\begin{aligned}
      \mathcal{F}(q, \theta; o)
      &= \mathrm{KL}\big(q(s) \;\Vert\; p_\theta(s \mid o)\big) - \log p_\theta(o) \\
      &= \mathbb{E}_{q(s)}[\log q(s) - \log p_\theta(o, s)] \;\; \ge -\log p_\theta(o).
      \end{aligned}\]

      This identity assumes positive finite evidence and a well-defined KL
      divergence. For discrete observations, probability mass \(p_\theta(o)\le1\)
      gives \(\mathcal{F}\ge0\). For continuous observations, \(p_\theta(o)\) is a
      density relative to a chosen measure and can exceed 1, so \(\mathcal{F}\)
      can be negative. All logarithms here are natural logarithms.

      Minimizing \(\mathcal{F}\) with respect to \(q\) performs approximate
      inference; minimizing with respect to \(\theta\) performs learning.

      ## Predictive Coding Perspective

      Predictive coding is a modelling perspective in which higher levels generate
      predictions and lower levels report residuals. The particular message
      passing and gradient updates depend on the model; none are validated here.

      ## Actions as Inference

      AIF models can select policies using expected free energy (EFE), with
      epistemic and preference-related terms depending on the specified model.
      The illustrative score below is not a general EFE derivation and does not
      implement an epistemic information-gain term.

      ## Planning as Inference (High-Level)

      - Define policies \(\pi\) over control sequences.
      - Specify a generative model, prediction horizon, preferences and EFE convention.
      - Derive the objective before calling it EFE; this example instead uses a heuristic.

      ## Worked Example (Toy)

      The following standard-library Python example scores a predictive
      distribution using negative expected utility plus 0.1 times predictive
      entropy. The arbitrary weight and entropy proxy make this a heuristic,
      not general EFE or conditional likelihood ambiguity. Inputs are normalized
      finite discrete distributions; likelihood-matrix columns sum to one.

      ```python
      from math import exp, fsum, log

      def softmax(values):
          largest = max(values)
          weights = [exp(value - largest) for value in values]
          total = fsum(weights)
          return [weight / total for weight in weights]

      def heuristic_policy_score(Qs, A, C):
          # C is an illustrative utility (unnormalized log-preference) vector.
          Po = [fsum(prob * state for prob, state in zip(row, Qs)) for row in A]
          negative_utility = -fsum(prob * utility for prob, utility in zip(Po, C))
          predictive_entropy = -fsum(prob * log(prob) for prob in Po if prob > 0)
          return negative_utility + 0.1 * predictive_entropy

      A = [[0.8, 0.2], [0.2, 0.8]]
      C = [0.0, 2.0]
      Qs = [0.5, 0.5]
      score = heuristic_policy_score(Qs, A, C)
      # A synthetic alternative score, not an evaluated alternative policy.
      policy_prob = softmax([-score, -(score + 0.5)])
      print(score, policy_prob)
      ```

      ## Applications

      - Sensorimotor control and robotics (goal-directed behavior with uncertainty)
      - Computational psychiatry (modelling priors and precision)
      - Adaptive experimentation (active learning)

      ## Further Reading

      The `refs` track contains unverified external reading links, not supporting evidence.

      ## Hierarchical Generative Models

      Hierarchies support abstraction and temporal depth. Higher levels encode
      slower variables and priors that contextualize lower-level dynamics. Belief
      updates proceed via message passing: predictions down, errors up.

      ## Continuous Control (Sketch)

      Some continuous linear-Gaussian models admit Kalman-style updates.
      No continuous controller or claim of biological applicability is derived
      or evaluated in this example.

  - id: translation-es
    type: translation
    language: es
    content: |
      # Inferencia Activa y el Principio de Energía Libre

      Ilustración didáctica sintética de la inferencia activa (AIF) bajo un modelo
      generativo. Las afirmaciones sobre organismos, corteza y atención son
      interpretaciones del modelo, no validación empírica ni necesidad biológica.
      El código usa una heurística: utilidad negativa más 0.1 por entropía
      predictiva; no deriva EFE general ni ganancia epistémica.

      ## Ideas Clave

      - Los organismos incorporan modelos generativos que predicen la entrada sensorial.
      - La percepción actualiza creencias para reducir errores de predicción.
      - La acción cambia el mundo para alinear sensaciones con predicciones.
      - El aprendizaje ajusta parámetros y estructura del modelo.

      ## Precisión y Atención

      La influencia de un error de predicción depende de su precisión (inversa de
      la varianza). El ponderado por precisión se asocia al control atencional:
      mayor precisión implica mayor impacto del error en las actualizaciones de
      creencias y en la selección de acciones.

      ## Energía Libre Variacional (Esbozo)

      Sea \(o\) la observación, \(s\) los estados latentes y \(\theta\) los
      parámetros, con \(p_\theta(o,s)=p_\theta(o\mid s)p_\theta(s)\) y un
      posterior aproximado \(q(s)\):

      \[\mathcal{F}(q,\theta;o)=\mathbb{E}_{q(s)}[\log q(s)-\log p_\theta(o,s)]\ge -\log p_\theta(o).\]

      Con evidencia positiva finita y KL bien definida, la cota es válida.
      Para masas discretas \(p_\theta(o)\le1\), \(\mathcal{F}\ge0\); una densidad
      continua puede superar 1, por lo que \(\mathcal{F}\) puede ser negativa.

      Minimizar \(\mathcal{F}\) en \(q\) realiza inferencia; en \(\theta\), aprendizaje.

      ## Codificación Predictiva

      En esta interpretación de modelado, una jerarquía intercambia predicciones
      y residuos. La dinámica depende del modelo; no se ha validado aquí como
      mecanismo cortical.

      ## La Acción como Inferencia

      La acción selecciona políticas que minimizan la energía libre esperada (EFE),
      equilibrando exactitud y complejidad. Surgen acciones epistémicas (informativas)
      y pragmáticas (orientadas a metas).

      ## Planificación como Inferencia (Alta Nivel)

      - Definir políticas \(\pi\) sobre secuencias de control.
      - Evaluar \(G(\pi)\) como EFE bajo \(q(o,s\mid\pi)\).
      - Elegir políticas con \(G(\pi)\) mínimo.

      ## Ejemplo de Trabajo (Juguete)

      Un pequeño ejemplo en Python aparece en la pista principal; el código es
      idéntico y los comentarios en español pueden agregarse según necesidad.

      ## Aplicaciones

      - Control sensorimotor y robótica
      - Psiquiatría computacional
      - Aprendizaje activo

      ## Lecturas Adicionales

      Consulte la pista `refs`.

      ## Modelos Generativos Jerárquicos

      Las jerarquías apoyan abstracción y profundidad temporal; los niveles altos
      contextualizan dinámicas de niveles bajos mediante priors.

      ## Control Continuo (Esbozo)

      En continuo, las actualizaciones se asemejan a Kalman; las leyes de control
      emergen de gradientes de EFE.

  - id: translation-fr
