      # Commentary — Glossary of Terms

      - Generative model: A probabilistic model that defines how data are
        generated from latent causes.
      - Precision: Inverse variance; modulates the influence of prediction errors.
      - Expected Free Energy (EFE): Anticipated free energy under a candidate policy.

  - id: code-python-simulation
    type: code
    content: |
      # Synthetic discrete illustration, not empirical validation.

      The arrays below are ordinary lists: prior_states sums to one, and each
      column of A and each B[a] sums to one. C contains illustrative utilities.
      posterior_update is exact Bayes for one categorical observation. The
      heuristic policy score is not a general EFE derivation, conditional
      likelihood ambiguity, or an epistemic information-gain objective.

      ```python
      from math import fsum, log

      class DiscreteAIF:
          def __init__(self, A, B, C, prior_states):
              self.A = A  # likelihood p(o|s)
              self.B = B  # transitions p(s'|s,a)
              self.C = C  # utilities (unnormalized log-preferences)
              self.Qs = list(prior_states)

          def posterior_update(self, o):
              weights = [prior * likelihood
                         for prior, likelihood in zip(self.Qs, self.A[o])]
              evidence = fsum(weights)
              if evidence <= 0:
                  raise ValueError("observation has zero evidence under the prior")
              self.Qs = [weight / evidence for weight in weights]
              return list(self.Qs)

          def heuristic_policy_score(self, a):
              Ps = [fsum(prob * state for prob, state in zip(row, self.Qs))
                    for row in self.B[a]]
              Po = [fsum(prob * state for prob, state in zip(row, Ps))
                    for row in self.A]
              negative_utility = -fsum(prob * utility
                                      for prob, utility in zip(Po, self.C))
              predictive_entropy = -fsum(prob * log(prob) for prob in Po if prob > 0)
              return negative_utility + 0.1 * predictive_entropy

      # Synthetic example: 2 states, 2 observations, 2 actions.
      A = [[0.8, 0.2], [0.2, 0.8]]
      B = [[[0.9, 0.1], [0.1, 0.9]], [[0.7, 0.3], [0.3, 0.7]]]
      C = [0.0, 2.0]
      agent = DiscreteAIF(A, B, C, prior_states=[0.5, 0.5])
      Qs = agent.posterior_update(1)
      scores = [agent.heuristic_policy_score(a) for a in range(2)]
      print(Qs, scores)
      ```

  - id: code-pseudocode
    type: code
    content: |
      Synthetic heuristic example; not a general EFE algorithm.

      ```text
      Initialize normalized categorical model (A, B), utility C, and prior Q(s)
      Repeat:
        Observe o
        Update Q(s) = Q(s) * A[o,s] / evidence; fail if evidence is zero
        For each action a:
          Score negative expected utility + 0.1 * predictive entropy
        Select the action with the smallest heuristic score
        Propagate Q(s) through B[a], act, then observe the next o
      ```

