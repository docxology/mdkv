    content: |
      # アクティブ・インファレンスと自由エネルギー原理

      生成モデルに基づくアクティブ・インファレンスの合成教材である。
      生物・皮質・注意の記述はモデル上の解釈であり、実証的検証ではない。
      コードは負の効用に予測エントロピーの 0.1 倍を加えるヒューリスティックで、
      一般的な EFE の導出でも認識的情報利得の実装でもない。

      ## 主要な直観

      - 生成モデルは感覚入力を予測する。
      - 知覚は予測誤差を減らすよう信念を更新する。
      - 行為は世界を変え，感覚を予測に一致させる。
      - 学習はパラメータと構造を更新する。

      ## 精度と注意

      誤差信号の影響は精度（分散の逆数）に依存し，注意ゲインとして解釈できる。

      ## 変分自由エネルギー（概略）

      \(\mathcal{F}(q,\theta;o)=\mathbb{E}_q[\log q-\log p_\theta(o,s)]\ge -\log p_\theta(o)\)。

      正で有限のエビデンスと定義された KL を仮定する。離散確率質量は
      \(p_\theta(o)\le1\) なので \(\mathcal{F}\ge0\) だが、連続密度は 1 を
      超えることがあり、\(\mathcal{F}\) は負にもなる。

      ## 予測符号化・推論としての行為・推論としての計画

      階層的メッセージパッシング；政策選択は期待自由エネルギーを最小化。

      ## 例・応用・文献

      主トラックのコードと `refs` を参照。階層モデルと連続制御の要点も含む。

