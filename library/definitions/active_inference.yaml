  - id: math-notes
    type: commentary
    content: |
      # Commentary — Mathematical Derivations and Notes

      For positive finite evidence and well-defined KL,
      \(\mathcal{F}=\mathrm{KL}(q\Vert p(s\mid o))-\ln p(o)\ge-\ln p(o)\).
      Only the discrete probability-mass case implies nonnegativity.

      Density counterexample: let \(p(o\mid s)=2\) on \(0\le o\le1/2\),
      independent of a discrete state with prior \([1/2,1/2]\). This density
      integrates to 1. At an interior observation the evidence density is 2
      and the exact posterior is \([1/2,1/2]\), so KL is zero and
      \(\mathcal{F}=-\ln2<0\), attaining the corrected lower bound.

      ## Gradients (Sketch)

      Let \(q(s)\) be in an exponential family with natural parameter \(\eta\).
      Then \(\nabla_\eta \mathcal{F} = \nabla_\eta \mathbb{E}_q[\log q - \log p]\).

