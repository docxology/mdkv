    content: |
      # सक्रिय अनुमान और मुक्त ऊर्जा सिद्धांत

      यह जनरेटिव मॉडल के तहत सक्रिय अनुमान का कृत्रिम शिक्षण उदाहरण है।
      जीवों, कॉर्टेक्स और ध्यान संबंधी कथन मॉडल की व्याख्याएँ हैं, अनुभवजन्य
      सत्यापन नहीं। कोड ऋणात्मक उपयोगिता और 0.1 गुना पूर्वानुमान एंट्रॉपी का
      अनुमानी स्कोर है; यह सामान्य EFE व्युत्पत्ति या ज्ञानात्मक सूचना-लाभ नहीं है।

      ## मुख्य बिंदु

      - जनरेटिव मॉडल संवेदन की भविष्यवाणी करता है।
      - धारणा भविष्यवाणी त्रुटि कम करने हेतु विश्वास अद्यतन करती है।
      - क्रिया दुनिया बदलती है ताकि संवेदन भविष्यवाणी से मेल खाए।
      - सीखना पैरामीटर/संरचना अद्यतन करता है।

      ## प्रीसिशन और अटेंशन

      त्रुटि का प्रभाव उसकी प्रीसिशन (वैरिएंस का व्युत्क्रम) पर निर्भर करता है।

      ## परिवर्तनशील मुक्त ऊर्जा (संक्षेप)

      \(\mathcal{F}(q,\theta;o)=\mathbb{E}_q[\log q-\log p_\theta(o,s)]\ge -\log p_\theta(o)\).

      साक्ष्य धनात्मक व सीमित और KL सुपरिभाषित होना चाहिए। असतत प्रायिकता
      द्रव्यमान \(p_\theta(o)\le1\) पर \(\mathcal{F}\ge0\); सतत घनत्व 1 से
      बड़ा हो सकता है, इसलिए \(\mathcal{F}\) ऋणात्मक हो सकती है।

      ## प्रिडिक्टिव कोडिंग और योजना-रूप में अनुमान

      पदानुक्रमित संदेश-पारगमन; नीतियाँ अपेक्षित मुक्त ऊर्जा को कम करती हैं।

      ## उदाहरण, अनुप्रयोग, पठन

      मुख्य ट्रैक का कोड देखें; `refs` देखें; पदानुक्रमित मॉडल और सतत नियंत्रण।

  - id: translation-ru
    type: translation
    language: ru
    content: |
      # Активный вывод и принцип свободной энергии

      Синтетический учебный пример активного вывода в генеративной модели.
      Утверждения об организмах, коре и внимании — интерпретации модели,
      а не эмпирическая проверка. Код использует эвристику: отрицательная
      полезность плюс 0.1 энтропии прогноза; это не общий вывод EFE
      и не эпистемический информационный выигрыш.

      ## Ключевые идеи

      - Генеративные модели предсказывают сенсорные данные.
      - Восприятие обновляет убеждения, снижая ошибку предсказания.
      - Действие меняет мир, согласуя ощущения с предсказаниями.
      - Обучение обновляет параметры и структуру.

      ## Точность и внимание

      Вес ошибки зависит от точности (обратной дисперсии), что связано с вниманием.

      ## Вариационная свободная энергия (эскиз)

      \(\mathcal{F}(q,\theta;o)=\mathbb{E}_q[\log q-\log p_\theta(o,s)]\ge -\log p_\theta(o)\).

      Нужны положительное конечное свидетельство и определённая KL-дивергенция.
      Для дискретной массы \(p_\theta(o)\le1\) имеем \(\mathcal{F}\ge0\);
      непрерывная плотность может превышать 1, а \(\mathcal{F}\) быть отрицательной.

      ## Предсказательное кодирование и планирование как вывод

      Иерархическая передача сообщений; выбор политики минимизирует ожидаемую свободную энергию.

      ## Пример, приложения, литература

      См. основной трек и `refs`; иерархические модели, непрерывное управление.

  - id: translation-ja
    type: translation
