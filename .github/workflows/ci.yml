name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check mdkv
      - run: uv run --no-sync mypy mdkv
      - run: uv run --no-sync pytest -q --cov=mdkv --cov-report=term-missing --cov-fail-under=90
      - run: uv run --no-sync sphinx-build -W --keep-going -b html docs docs/_build/html
      - run: uv build --out-dir docs/_build/dist
      - name: Inspect installed wheel outside checkout
        run: |
          uv venv docs/_build/wheel-env
          uv pip install --python docs/_build/wheel-env/bin/python docs/_build/dist/*.whl
          cd docs/_build
          wheel-env/bin/python -c "from mdkv.library import example_definitions_dir, load_example_document; names=[p.name for p in example_definitions_dir().iterdir() if p.name.endswith('.yaml')]; assert len(names)==7; [load_example_document(name) for name in names]"

  minimum-supported-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - run: uv sync --locked --extra dev --python 3.11
      - run: uv run --no-sync --python 3.11 pytest -q
