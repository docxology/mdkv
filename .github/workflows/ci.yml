name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
        with:
          python-version-file: ".python-version"
      - name: Install (create .venv from uv.lock with dev extras)
        run: uv sync --extra dev
      - name: Run tests with coverage
        run: uv run pytest -q --cov=mdkv --cov-report=term-missing
      - name: Build docs
        run: uv run sphinx-build -b html docs docs/_build/html
