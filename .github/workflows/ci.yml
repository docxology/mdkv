name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install (create .venv from uv.lock with dev extras)
        run: uv sync --extra dev
      - name: Run tests with coverage
        run: uv run pytest -q --cov=mdkv --cov-report=term-missing
      - name: Build docs
        run: uv run sphinx-build -b html docs docs/_build/html
