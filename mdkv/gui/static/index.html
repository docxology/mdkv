<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MDKV GUI</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="toolbar">
      <input id="openPath" placeholder="Path to .mdkv" />
      <button id="btnOpen">Open</button>
      <label for="libSelect">Library:</label>
      <select id="libSelect"></select>
      <label for="editorTrack">Edit track:</label>
      <select id="editorTrack" aria-label="Editor track"></select>
      <button id="btnSave">Save</button>
      <button id="btnValidate">Validate</button>
      <button id="btnDiff">Diff</button>
      <button class="theme-toggle" id="btnTheme">🌙</button>
    </div>
    <div class="panes" id="panes">
      <textarea id="left" aria-label="Selected track Markdown" placeholder="Select a track to edit its exact Markdown content" disabled></textarea>
      <div class="preview">
        <div class="preview-toolbar">
          <label>Preview tracks:</label>
          <div id="trackFilters" class="track-filters"></div>
        </div>
        <iframe id="right" title="Markdown preview" sandbox="" referrerpolicy="no-referrer"></iframe>
      </div>
    </div>
    <div class="diff-view" id="diffView">
      <div class="diff-pane" id="diffLeft"><h3>Document A</h3><div id="diffLeftContent"></div></div>
      <div class="diff-pane" id="diffRight"><h3>Document B</h3><div id="diffRightContent"></div></div>
    </div>
    <div class="status" id="status" role="status"></div>
    <script src="/static/main.js"></script>
  </body>
</html>
