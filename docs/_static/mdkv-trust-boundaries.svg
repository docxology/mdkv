<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">MDKV trust boundaries</title>
  <desc id="desc">Supplier documents cross bounded ZIP and YAML validation into the model; unrelated websites cross Host and Origin checks before the loopback GUI; trusted local callers alone may supply native converter arguments.</desc>
  <rect x="0" y="0" width="960" height="330" fill="#ffffff"/>
  <g font-family="Inter, Helvetica, Arial, sans-serif" fill="#172033">
    <text x="32" y="34" font-size="20" font-weight="700">Trust boundaries at a glance</text>
    <text x="32" y="58" font-size="13" fill="#475569">Untrusted input is bounded before it reaches the in-memory model or a native tool.</text>

    <rect x="32" y="86" width="220" height="92" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="50" y="112" font-size="13" font-weight="700">Supplier document</text>
    <text x="50" y="134" font-size="12" fill="#475569">ZIP/YAML/Markdown bytes</text>
    <text x="50" y="152" font-size="12" fill="#475569">No extraction; duplicate names refused</text>

    <line x1="252" y1="132" x2="306" y2="132" stroke="#ea580c" stroke-width="2.5" marker-end="url(#a)"/>
    <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ea580c"/></marker></defs>

    <rect x="316" y="86" width="230" height="92" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="334" y="112" font-size="13" font-weight="700">Bounded reader</text>
    <text x="334" y="134" font-size="12" fill="#475569">Archive/member/manifest size,</text>
    <text x="334" y="152" font-size="12" fill="#475569">YAML depth/nodes, no ZIP64 locator</text>

    <line x1="546" y1="132" x2="600" y2="132" stroke="#2563eb" stroke-width="2.5" marker-end="url(#b)"/>
    <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker></defs>

    <rect x="610" y="86" width="318" height="92" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="628" y="112" font-size="13" font-weight="700">Typed document model and services</text>
    <text x="628" y="134" font-size="12" fill="#475569">Exact stdlib regex in a reaped worker;</text>
    <text x="628" y="152" font-size="12" fill="#475569">atomic writes, no code-track execution</text>

    <rect x="32" y="202" width="300" height="86" rx="10" fill="#faf5ff" stroke="#d8b4fe"/>
    <text x="50" y="228" font-size="13" font-weight="700">Unrelated website</text>
    <text x="50" y="250" font-size="12" fill="#475569">Host + Origin/Fetch Metadata checks</text>
    <text x="50" y="268" font-size="12" fill="#475569">loopback bind; sandboxed preview iframe</text>

    <line x1="332" y1="245" x2="386" y2="245" stroke="#7e22ce" stroke-width="2.5" marker-end="url(#c)"/>
    <defs><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7e22ce"/></marker></defs>

    <rect x="396" y="202" width="230" height="86" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="414" y="228" font-size="13" font-weight="700">Local GUI API</text>
    <text x="414" y="250" font-size="12" fill="#475569">No authentication claim;</text>
    <text x="414" y="268" font-size="12" fill="#475569">shared current document</text>

    <rect x="646" y="202" width="282" height="86" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="664" y="228" font-size="13" font-weight="700">Trusted native caller</text>
    <text x="664" y="250" font-size="12" fill="#475569">Pandoc args, cover/reference docs</text>
    <text x="664" y="268" font-size="12" fill="#475569">PDF engines stay outside the sandbox</text>
  </g>
</svg>
